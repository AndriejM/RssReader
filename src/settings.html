<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title data-i18n="settings.title"></title>
  <script src="theme-boot.js"></script>
  <script type="module" src="lib/i18n-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <script type="module" src="settings.js"></script>
</head>
<body>
  <!--
    Icon sprite of the screen switcher and the theme toggle: the same <symbol> definitions the
    reader page has, so every screen draws its icons from the same glyphs.
  -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-reader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
      <line x1="10" y1="14" x2="18" y2="14"></line>
      <line x1="10" y1="18" x2="15" y2="18"></line>
      <rect x="10" y="6" width="8" height="4" rx="1"></rect>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
    <symbol id="icon-tune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="21" x2="4" y2="14"></line>
      <line x1="4" y1="10" x2="4" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12" y2="3"></line>
      <line x1="20" y1="21" x2="20" y2="16"></line>
      <line x1="20" y1="12" x2="20" y2="3"></line>
      <line x1="1" y1="14" x2="7" y2="14"></line>
      <line x1="9" y1="8" x2="15" y2="8"></line>
      <line x1="17" y1="16" x2="23" y2="16"></line>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </symbol>
  </svg>

  <div class="page">
    <header class="page-header">
      <h1 data-i18n="settings.title"></h1>
      <div class="actions">
        <!-- The switcher `lib/nav.js` fills with the three screen icons, current screen marked. -->
        <nav class="nav" data-nav-active="global" data-i18n-aria="nav.group"></nav>
        <button id="btn-theme" class="icon-btn theme-toggle" type="button" data-i18n-title="common.theme.toggle" data-i18n-aria="common.theme.toggle">
          <svg class="icon icon-moon" aria-hidden="true"><use href="#icon-moon"></use></svg>
          <svg class="icon icon-sun" aria-hidden="true"><use href="#icon-sun"></use></svg>
        </button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <details class="info">
          <summary
            class="icon-btn"
            data-i18n-title="settings.info.tooltip"
            data-i18n-aria="settings.info.aria"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </summary>
          <p class="hint" data-i18n="settings.hint"></p>
        </details>
        <button id="btn-save" class="primary" type="button" data-i18n="settings.save"></button>
      </div>

      <table class="settings-table">
        <!-- Поля называет их `<label>`, а само поле таблицы — эту подпись: без неё экран, входя в
             таблицу, не говорит, что за неё отвечает. -->
        <caption class="sr-only" data-i18n="settings.caption"></caption>
        <tbody>
          <tr>
            <th class="field-name">
              <label for="read-ttl-days" data-i18n="settings.ttl"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <div class="unit">
                  <input id="read-ttl-days" type="number" min="1" max="3650" step="1" />
                  <span class="muted" data-i18n="settings.daysUnit"></span>
                </div>
                <button
                  id="btn-clear-read"
                  class="icon-btn danger"
                  type="button"
                  data-i18n-title="settings.clearRead"
                  data-i18n-aria="settings.clearRead"
                >
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
              <div class="error" id="read-ttl-error"></div>
            </td>
          </tr>

          <tr>
            <th class="field-name">
              <label for="sound-file" data-i18n="settings.sound"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <label class="switch" for="sound-enabled">
                  <input id="sound-enabled" type="checkbox" />
                  <span data-i18n="settings.soundEnabled"></span>
                </label>
                <select id="sound-file"></select>
                <button
                  id="btn-sound-play"
                  class="icon-btn"
                  type="button"
                  data-i18n-title="settings.soundPlay.tooltip"
                  data-i18n-aria="settings.soundPlay.aria"
                >
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                  </svg>
                </button>
                <div class="volume">
                  <input
                    id="sound-volume"
                    type="range"
                    min="0"
                    max="100"
                    step="5"
                    data-i18n-title="settings.soundVolume"
                    data-i18n-aria="settings.soundVolume"
                  />
                  <output id="sound-volume-value" class="muted" for="sound-volume"></output>
                </div>
              </div>
            </td>
          </tr>

          <tr>
            <th class="field-name">
              <label for="show-message" data-i18n="settings.showMessage"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <input id="show-message" type="checkbox" />
              </div>
            </td>
          </tr>

          <tr>
            <th class="field-name">
              <label for="language-file" data-i18n="settings.language"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <select id="language-file"></select>
              </div>
            </td>
          </tr>

          <tr class="status-row">
            <td colspan="2">
              <span class="status" id="read-status"></span>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="card-foot">
        <span class="stats" id="read-stats"></span>
        <span class="stats" id="sound-stats"></span>
      </div>
    </section>

    <!--
      Что экран говорит вслух о нажатии «Записать»: что именно записано, что поле с днями принято не
      было, сколько отметок о прочитанном стёрто и почему сигнал не зазвучал. Те же слова стоят строкой
      под таблицей полей, где их видит глаз; эта строка нигде не рисуется (см. `.sr-only` в `theme.css`),
      но экран читает её вслух. Подсказка «изменения не записаны» вслух не повторяется: она стоит на
      экране постоянно.
    -->
    <p class="sr-only" id="settings-announce" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
</body>
</html>
