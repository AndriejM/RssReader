<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title data-i18n="settings.title"></title>
  <script src="theme-boot.js"></script>
  <script type="module" src="lib/i18n-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <script type="module" src="settings.js"></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 data-i18n="settings.title"></h1>
      <div class="actions">
        <button id="btn-feeds" type="button" data-i18n="settings.feeds"></button>
        <button id="btn-reader" type="button" data-i18n="settings.reader"></button>
        <button id="btn-theme" type="button"></button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <details class="info">
          <summary
            class="icon-btn"
            data-i18n-title="settings.info.tooltip"
            data-i18n-aria="settings.info.aria"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </summary>
          <p class="hint" data-i18n="settings.hint"></p>
        </details>
        <button id="btn-save" class="primary" type="button" data-i18n="settings.save"></button>
      </div>

      <table class="settings-table">
        <tbody>
          <tr>
            <th class="field-name">
              <label for="read-ttl-days" data-i18n="settings.ttl"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <div class="unit">
                  <input id="read-ttl-days" type="number" min="1" max="3650" step="1" />
                  <span class="muted" data-i18n="settings.daysUnit"></span>
                </div>
                <button
                  id="btn-clear-read"
                  class="icon-btn danger"
                  type="button"
                  data-i18n-title="settings.clearRead"
                  data-i18n-aria="settings.clearRead"
                >
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
              <div class="error" id="read-ttl-error"></div>
            </td>
          </tr>

          <tr>
            <th class="field-name">
              <label for="sound-file" data-i18n="settings.sound"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <select id="sound-file"></select>
                <button
                  id="btn-sound-play"
                  class="icon-btn"
                  type="button"
                  data-i18n-title="settings.soundPlay.tooltip"
                  data-i18n-aria="settings.soundPlay.aria"
                >
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <th class="field-name">
              <label for="language-file" data-i18n="settings.language"></label>
            </th>
            <td class="field-value">
              <div class="control">
                <select id="language-file"></select>
              </div>
            </td>
          </tr>

          <tr class="status-row">
            <td colspan="2">
              <span class="status" id="read-status"></span>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="card-foot">
        <span class="stats" id="read-stats"></span>
        <span class="stats" id="sound-stats"></span>
      </div>
    </section>
  </div>
</body>
</html>
