<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title data-i18n="settings.title"></title>
  <script src="theme-boot.js"></script>
  <script type="module" src="lib/i18n-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <script type="module" src="settings.js"></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1 data-i18n="settings.title"></h1>
      <div class="actions">
        <button id="btn-feeds" type="button" data-i18n="settings.feeds"></button>
        <button id="btn-reader" type="button" data-i18n="settings.reader"></button>
        <button id="btn-theme" type="button"></button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <button id="btn-save" class="primary" type="button" data-i18n="settings.save"></button>
      </div>

      <div class="row">
        <div class="field">
          <label for="read-ttl-days" data-i18n="settings.ttl"></label>
          <div class="unit">
            <input id="read-ttl-days" type="number" min="1" max="3650" step="1" />
            <span class="muted" data-i18n="settings.daysUnit"></span>
          </div>
          <div class="error" id="read-ttl-error"></div>
        </div>
        <button id="btn-clear-read" class="danger" type="button" data-i18n="settings.clearRead"></button>
      </div>

      <div class="row">
        <button
          id="btn-sound-play"
          class="icon-btn"
          type="button"
          data-i18n-title="settings.soundPlay.tooltip"
          data-i18n-aria="settings.soundPlay.aria"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <div class="field">
          <label for="sound-file" data-i18n="settings.sound"></label>
          <select id="sound-file"></select>
        </div>
        <div class="field">
          <label for="language-file" data-i18n="settings.language"></label>
          <select id="language-file"></select>
        </div>
      </div>

      <p class="hint" data-i18n="settings.hint"></p>

      <div class="card-foot">
        <span class="stats" id="read-stats"></span>
        <span class="stats" id="sound-stats"></span>
        <span class="status" id="read-status"></span>
      </div>
    </section>
  </div>
</body>
</html>
