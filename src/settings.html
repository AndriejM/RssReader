<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Глобальные настройки</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <script type="module" src="settings.js"></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Глобальные настройки</h1>
      <div class="actions">
        <button id="btn-feeds" type="button">Настройки лент</button>
        <button id="btn-reader" type="button">Открыть читалку</button>
        <button id="btn-theme" type="button">Светлая тема</button>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <button id="btn-save" class="primary" type="button">Записать</button>
      </div>

      <div class="row">
        <div class="field">
          <label for="read-ttl-days">read_ttl_days — через сколько дней забыть прочитанные</label>
          <div class="unit">
            <input id="read-ttl-days" type="number" min="1" max="3650" step="1" />
            <span class="muted">дней</span>
          </div>
          <div class="error" id="read-ttl-error"></div>
        </div>
        <button id="btn-clear-read" class="danger" type="button">Забыть прочитанные</button>
      </div>

      <div class="row">
        <button id="btn-sound-play" class="icon-btn" type="button" title="Прослушать выбранный сигнал" aria-label="Прослушать выбранный сигнал">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <div class="field">
          <label for="sound-file">Звук при скачивании — файл из src/media</label>
          <select id="sound-file"></select>
        </div>
      </div>

      <p class="hint">
        Заголовок, удалённый из читалки, помечается прочитанным, чтобы лента не вернула его при
        следующей загрузке. Через read_ttl_days метка сгорает, и новость может появиться снова.
        «Забыть прочитанные» удаляет все метки сразу — удалённые новости вернутся в ленты.
      </p>

      <div class="card-foot">
        <span class="stats" id="read-stats"></span>
        <span class="stats" id="sound-stats"></span>
        <span class="status" id="read-status"></span>
      </div>
    </section>
  </div>
</body>
</html>
