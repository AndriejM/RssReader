<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <!--
    The reader page is the one page of this extension that asks a stranger's server for a picture: a
    headline's preview image from the feed (`extract.sanitizePreview` keeps its `src`) and a feed's
    favicon. Without this line the request carries the address of the extension page as its `Referer`,
    so the site learns which extension shows its picture — and a site that guards its images against
    other people's pages answers such a request with a blocked picture instead of the picture.
  -->
  <meta name="referrer" content="no-referrer" />
  <title data-i18n="app.name"></title>
  <script src="theme-boot.js"></script>
  <script type="module" src="lib/i18n-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/reader.css" />
  <script type="module" src="index.js"></script>
</head>
<body class="app">
  <!--
    Icon sprite: every icon is a <symbol> reused through <use>, so one definition serves both
    the markup and the icons index.js builds at runtime. `stroke="currentColor"` makes them
    follow the text colour of whatever theme is active.
  -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-reader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
      <line x1="10" y1="14" x2="18" y2="14"></line>
      <line x1="10" y1="18" x2="15" y2="18"></line>
      <rect x="10" y="6" width="8" height="4" rx="1"></rect>
    </symbol>
    <symbol id="icon-rss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 11a9 9 0 0 1 9 9"></path>
      <path d="M4 4a16 16 0 0 1 16 16"></path>
      <circle cx="5" cy="19" r="1"></circle>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
    <symbol id="icon-tune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="21" x2="4" y2="14"></line>
      <line x1="4" y1="10" x2="4" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12" y2="3"></line>
      <line x1="20" y1="21" x2="20" y2="16"></line>
      <line x1="20" y1="12" x2="20" y2="3"></line>
      <line x1="1" y1="14" x2="7" y2="14"></line>
      <line x1="9" y1="8" x2="15" y2="8"></line>
      <line x1="17" y1="16" x2="23" y2="16"></line>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      <line x1="10" y1="11" x2="10" y2="17"></line>
      <line x1="14" y1="11" x2="14" y2="17"></line>
    </symbol>
    <symbol id="icon-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      <polyline points="15 3 21 3 21 9"></polyline>
      <line x1="10" y1="14" x2="21" y2="3"></line>
    </symbol>
    <!-- Метка «прочитано»: галочка в круге. Та же метка стоит на строке средней колонки. -->
    <symbol id="icon-read" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </symbol>
    <!-- Та же метка, снятая: круг с крестом вместо галочки. -->
    <symbol id="icon-unread" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </symbol>
    <!-- Возврат удалённого заголовка: та же стрелка, что ведёт «назад» во всех экранах. -->
    <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"></polyline>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </symbol>
    <!-- The same «?» glyph the other two screens use for their explanation, the same hand draws it. -->
    <symbol id="icon-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </symbol>
    <!-- Полный текст статьи: страница-документ со строками текста. -->
    <symbol id="icon-article" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <span data-i18n="app.name"></span>
      <span class="badge" id="total-count" data-i18n-title="reader.count.tooltip">0</span>
    </div>
    <div class="actions">
      <!-- The switcher `lib/nav.js` fills with the three screen icons, current screen marked. -->
      <nav class="nav" data-nav-active="reader" data-i18n-aria="nav.group"></nav>
      <!-- Подсказка по клавишам читалки: тот же список, что ведёт README, только внутри читалки. -->
      <button id="btn-keys" class="icon-btn" type="button" data-i18n-title="reader.keys.toggle" data-i18n-aria="reader.keys.toggle">
        <svg class="icon" aria-hidden="true"><use href="#icon-help"></use></svg>
      </button>
      <button id="btn-theme" class="icon-btn theme-toggle" type="button" data-i18n-title="common.theme.toggle" data-i18n-aria="common.theme.toggle">
        <svg class="icon icon-moon" aria-hidden="true"><use href="#icon-moon"></use></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="#icon-sun"></use></svg>
      </button>
    </div>
  </header>

  <main class="panels">
    <section id="panel-feeds" class="panel panel-feeds" data-i18n-aria="reader.feeds.panelAria">
      <div class="panel-head">
        <h2 data-i18n="reader.feeds.title"></h2>
        <!-- The size switcher `lib/fontsize.js` builds: it scales this column only. -->
        <div class="font-scale" data-font-scale="feeds"></div>
      </div>
      <div class="panel-scroll">
        <!-- Строки этой колонки — ленты, одна из них выбрана (`aria-current` в `index.js`). -->
        <ul class="list" id="feed-list" role="list" data-i18n-aria="reader.feeds.list.aria"></ul>
        <p class="empty" id="feeds-empty" hidden data-i18n="reader.feeds.empty"></p>
      </div>
    </section>

    <!--
      The gap between two columns is the handle that drags their border: `lib/columns.js` puts the
      grab area here, so a handle is never laid out on top of a column and never eats a column's
      pixels. `data-column-resize` names the column to the left of the border.
    -->
    <div class="panel-gap" data-column-resize="feeds"></div>

    <section id="panel-headlines" class="panel panel-headlines" data-i18n-aria="reader.headlines.panelAria">
      <div class="panel-head">
        <h2 id="headlines-title" data-i18n="reader.headlines.title"></h2>
        <span class="muted" id="headlines-count"></span>
        <!--
          One field filters the middle column: it keeps the headlines whose title or feed name
          contains what is typed, and it follows the same selection as the two icons beside it.
        -->
        <input
          id="headline-search"
          class="panel-search"
          type="search"
          autocomplete="off"
          spellcheck="false"
          data-i18n-placeholder="reader.search.placeholder"
          data-i18n-aria="reader.search.aria"
        />
        <!--
          Load / clear sit beside the feed name and follow the left column's selection: a single
          feed loads/cleans just that feed, «Все ленты» does it for every feed at once.
        -->
        <button id="btn-load" class="icon-btn" type="button" data-i18n-title="reader.refresh.tooltip" data-i18n-aria="reader.refresh.aria">
          <svg class="icon" aria-hidden="true"><use href="#icon-rss"></use></svg>
        </button>
        <button id="btn-clear" class="icon-btn danger" type="button" data-i18n-title="reader.clearAll.tooltip" data-i18n-aria="reader.clearAll.aria">
          <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
        </button>
        <div class="font-scale" data-font-scale="headlines"></div>
      </div>
      <!--
        One quiet line under the head of the middle column: when the headlines of what is selected
        now were last brought in, and when they are next asked for on their own. It stays hidden
        while the selection has nothing to say about its own load.
      -->
      <p class="panel-status muted" id="feed-status" hidden></p>
      <div class="panel-scroll">
        <!--
          Средняя колонка — `listbox`: её строки — `option` (их ставит `index.js`), открытая новость —
          `aria-selected`, а клавиатурный курсор — `aria-activedescendant` той же строки. Курсор стоит
          на самом списке: одна строка `tabindex` на всю колонку, поэтому пять тысяч заголовков не
          разбивают Tab на пять тысяч кнопок, а строка `option` не держит внутри себя действия.
        -->
        <ul
          class="list"
          id="headline-list"
          role="listbox"
          tabindex="0"
          data-i18n-aria="reader.headlines.list.aria"
        ></ul>
        <p class="empty" id="headlines-empty" hidden data-i18n="reader.headlines.emptyNoFeed"></p>
        <!--
          Первое открытие читалки: средней колонке нечего показывать, пока в хранилище нет ни одной
          ленты. Карточка называет это прямо и даёт кнопку перехода на экран лент — тот же путь, что
          иконка лент в переключателе экранов (`lib/nav.js`), только сказанная словами.
        -->
        <div class="start-card" id="start-card" hidden>
          <svg class="icon start-card-icon" aria-hidden="true"><use href="#icon-rss"></use></svg>
          <h3 data-i18n="reader.start.title"></h3>
          <p class="muted start-card-hint" data-i18n="reader.start.hint"></p>
          <button
            id="btn-open-feeds"
            class="primary"
            type="button"
            data-i18n="reader.start.openFeeds"
            data-i18n-aria="reader.start.openFeeds"
          ></button>
        </div>
      </div>
    </section>

    <div class="panel-gap" data-column-resize="headlines"></div>

    <section id="panel-content" class="panel panel-content" data-i18n-aria="reader.content.panelAria">
      <!--
        Original link now lives in the article title itself, so the toolbar holds the three things a
        headline can be given: the full text the reader pulls from the page on demand, the mark that
        keeps its news out of the polls («прочитано») and the trash that throws the headline itself away.
      -->
      <div class="content-toolbar">
        <button
          id="content-article"
          class="icon-btn"
          type="button"
          data-i18n-title="reader.content.article.tooltip"
          data-i18n-aria="reader.content.article.aria"
          hidden
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-article"></use></svg>
        </button>
        <button
          id="content-read"
          class="icon-btn"
          type="button"
          aria-pressed="false"
          data-i18n-title="reader.content.mark.tooltip"
          data-i18n-aria="reader.content.mark.aria"
          hidden
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-read"></use></svg>
        </button>
        <button id="content-delete" class="icon-btn danger" type="button" data-i18n-title="reader.content.delete.tooltip" data-i18n-aria="reader.content.delete.aria" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
        </button>
        <div class="font-scale" data-font-scale="content"></div>
      </div>
      <article class="content-body" id="content-body">
        <!--
          Плейсхолдер правой панели стоит в разметке и остаётся на месте, когда панель показывает
          то себя, то статью: живой регион, который пересоздают, экрану объявить нельзя. Поэтому
          строка статьи — отдельный сосед внутри той же панели. Роль строке (`status` или `alert`)
          ставит `showPlaceholder()`: отказ загрузки — то, о чём нужно сказать сразу, пустота панели
          — то, что не должно перебивать чтение (см. `index.js`).
        -->
        <p class="empty" id="content-empty" role="status" data-i18n="reader.content.empty"></p>
        <div class="article-body" id="article-body"></div>
      </article>
      <!--
        Строка отмены: её ставит удаление заголовка, и она же возвращает его назад, пока её окно
        стоит. Подпись кнопки названа словарём, сам текст строки называет удалённый заголовок
        (см. `index.js` -> `renderUndo`). Она идёт после текста и лежит вдоль его нижнего края —
        наложенной на колонку, а не в её ряду: появление строки не двигает статью (см.
        `.undo-line` в `styles/reader.css`).
      -->
      <p class="undo-line" id="undo-line" hidden>
        <span class="undo-text" id="undo-text"></span>
        <button id="btn-undo" class="undo-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-undo"></use></svg>
          <span data-i18n="reader.undo.button"></span>
        </button>
      </p>
    </section>
  </main>

  <!--
    Подсказка по клавишам: список, который раньше жил только в README, теперь стоит там, где клавиши
    применяются. `showModal()` (см. `index.js`) даёт ему всё, что нужно клавиатуре: фокус запирается
    внутри, `Esc` и клик по фону закрывают окно, а соседям по экрану `index.js` ставит `aria-hidden`,
    чтобы указатель Tab не уходил за окно.
  -->
  <dialog id="keys-help" class="keys-help" aria-labelledby="keys-help-title">
    <div class="keys-card">
      <div class="keys-head">
        <h2 id="keys-help-title" data-i18n="reader.keys.title"></h2>
        <button id="btn-keys-close" class="icon-btn" type="button" data-i18n-title="reader.keys.close" data-i18n-aria="reader.keys.close">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </div>
      <table class="keys-table">
        <caption class="sr-only" data-i18n="reader.keys.caption"></caption>
        <thead>
          <tr>
            <th scope="col" data-i18n="reader.keys.columnKey"></th>
            <th scope="col" data-i18n="reader.keys.columnWhat"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="keys-keys"><kbd>/</kbd></td>
            <td data-i18n="reader.keys.search"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>↓</kbd><kbd>j</kbd></td>
            <td data-i18n="reader.keys.next"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>↑</kbd><kbd>k</kbd></td>
            <td data-i18n="reader.keys.prev"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>Enter</kbd></td>
            <td data-i18n="reader.keys.original"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>f</kbd></td>
            <td data-i18n="reader.keys.fullText"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>r</kbd></td>
            <td data-i18n="reader.keys.refresh"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>m</kbd></td>
            <td data-i18n="reader.keys.mark"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>d</kbd></td>
            <td data-i18n="reader.keys.delete"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>u</kbd></td>
            <td data-i18n="reader.keys.undo"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>Esc</kbd></td>
            <td data-i18n="reader.keys.escape"></td>
          </tr>
          <tr>
            <td class="keys-keys"><kbd>?</kbd></td>
            <td data-i18n="reader.keys.help"></td>
          </tr>
        </tbody>
      </table>
      <p class="muted keys-hint" data-i18n="reader.keys.hint"></p>
    </div>
  </dialog>

  <!--
    Что читалка говорит вслух, когда перерисовывает панель: сколько заголовков пришло, сколько лент
    отказалось, что удалено. Эта строка нигде не рисуется (см. `.sr-only` в `reader.css`), но экран
    читает её вслух; та же правда стоит в самих панелях, где её видит глаз. Строку описывает общий
    для всех экранов `theme.css` (см. `.sr-only`).
  -->
  <p class="sr-only" id="reader-announce" role="status" aria-live="polite" aria-atomic="true"></p>

  <!--
    Read last in the markup on purpose: it paints every column at its remembered size and its
    remembered width from the localStorage cache, and the panels it looks for have to exist already.
    It runs before the page module, so a column never shows its text at the wrong size or the wrong
    width first.
  -->
  <script src="font-boot.js"></script>
  <script src="columns-boot.js"></script>
</body>
</html>
