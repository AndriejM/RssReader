<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>RSS Reader</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/reader.css" />
  <script type="module" src="index.js"></script>
</head>
<body class="app">
  <!--
    Icon sprite: every icon is a <symbol> reused through <use>, so one definition serves both
    the markup and the icons index.js builds at runtime. `stroke="currentColor"` makes them
    follow the text colour of whatever theme is active.
  -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
    <symbol id="icon-tune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="21" x2="4" y2="14"></line>
      <line x1="4" y1="10" x2="4" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12" y2="3"></line>
      <line x1="20" y1="21" x2="20" y2="16"></line>
      <line x1="20" y1="12" x2="20" y2="3"></line>
      <line x1="1" y1="14" x2="7" y2="14"></line>
      <line x1="9" y1="8" x2="15" y2="8"></line>
      <line x1="17" y1="16" x2="23" y2="16"></line>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      <line x1="10" y1="11" x2="10" y2="17"></line>
      <line x1="14" y1="11" x2="14" y2="17"></line>
    </symbol>
    <symbol id="icon-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      <polyline points="15 3 21 3 21 9"></polyline>
      <line x1="10" y1="14" x2="21" y2="3"></line>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      RSS Reader
      <span class="badge" id="total-count" title="Заголовков в хранилище">0</span>
      <button id="btn-clear-all" class="icon-btn danger" type="button" title="Удалить все заголовки из хранилище" aria-label="Удалить все">
        <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
      </button>
    </div>
    <div class="header-actions">
      <button id="btn-settings" class="icon-btn" type="button" title="Настройки лент" aria-label="Настройки лент">
        <svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg>
      </button>
      <button id="btn-global-settings" class="icon-btn" type="button" title="Глобальные настройки" aria-label="Глобальные настройки">
        <svg class="icon" aria-hidden="true"><use href="#icon-tune"></use></svg>
      </button>
      <button id="btn-theme" class="icon-btn theme-toggle" type="button" title="Переключить тему" aria-label="Переключить тему">
        <svg class="icon icon-moon" aria-hidden="true"><use href="#icon-moon"></use></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="#icon-sun"></use></svg>
      </button>
    </div>
  </header>

  <main class="panels">
    <section class="panel panel-feeds" aria-label="Список RSS лент">
      <div class="panel-head">
        <h2>Ленты</h2>
        <button id="btn-refresh" class="icon-btn" type="button" title="Загрузить заголовки выбранной ленты" aria-label="Обновить">
          <svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
        </button>
      </div>
      <div class="panel-scroll">
        <ul class="list" id="feed-list"></ul>
        <p class="empty" id="feeds-empty" hidden>Лент нет. Добавьте их на экране «Настройки лент».</p>
      </div>
    </section>

    <section class="panel panel-headlines" aria-label="Заголовки новостей">
      <div class="panel-head">
        <h2 id="headlines-title">Заголовки</h2>
        <span class="muted" id="headlines-count"></span>
      </div>
      <div class="panel-scroll">
        <ul class="list" id="headline-list"></ul>
        <p class="empty" id="headlines-empty" hidden>Выберите ленту слева.</p>
      </div>
    </section>

    <section class="panel panel-content" aria-label="Содержание новости">
      <!-- Original link now lives in the article title itself, so the toolbar only holds delete. -->
      <div class="content-toolbar">
        <button id="content-delete" class="icon-btn danger" type="button" title="Удалить заголовок из списка и из хранилища" aria-label="Удалить" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
        </button>
      </div>
      <article class="content-body" id="content-body">
        <p class="empty">Выберите заголовок новости в средней панели.</p>
      </article>
    </section>
  </main>
</body>
</html>
