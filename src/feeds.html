<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Настройки RSS лент</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/feeds.css" />
  <script type="module" src="feeds.js"></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Настройки RSS лент</h1>
      <div class="actions">
        <button id="btn-add" class="primary" type="button">Добавить ленту</button>
        <button id="btn-reader" type="button">Открыть читалку</button>
        <button id="btn-theme" type="button">Светлая тема</button>
      </div>
    </header>

    <p class="hint">
      delay_timeout — период автоматической загрузки заголовков (минуты, Chrome не позволяет реже
      1 минуты). clean_timeout — сколько новость хранится в localstorage после загрузки
      (минуты), по истечении этого времени она удаляется автоматически.
    </p>

    <section id="feed-cards"></section>
    <p class="empty muted" id="feeds-empty">Лент нет. Нажмите «Добавить ленту».</p>
  </div>
</body>
</html>
