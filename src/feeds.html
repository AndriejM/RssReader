<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title data-i18n="feeds.title"></title>
  <script src="theme-boot.js"></script>
  <script type="module" src="lib/i18n-boot.js"></script>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/feeds.css" />
  <script type="module" src="feeds.js"></script>
</head>
<body>
  <!--
    Icon sprite of the screen switcher, the theme toggle and this screen's own actions: the same
    <symbol> definitions the reader page has, so every screen draws its icons from the same glyphs,
    plus the glyphs only the feed table uses. The pages are plain HTML with no build step and no
    shared include, so this block is kept in step by hand.
  -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-reader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
      <line x1="10" y1="14" x2="18" y2="14"></line>
      <line x1="10" y1="18" x2="15" y2="18"></line>
      <rect x="10" y="6" width="8" height="4" rx="1"></rect>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
    <symbol id="icon-tune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="21" x2="4" y2="14"></line>
      <line x1="4" y1="10" x2="4" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12" y2="3"></line>
      <line x1="20" y1="21" x2="20" y2="16"></line>
      <line x1="20" y1="12" x2="20" y2="3"></line>
      <line x1="1" y1="14" x2="7" y2="14"></line>
      <line x1="9" y1="8" x2="15" y2="8"></line>
      <line x1="17" y1="16" x2="23" y2="16"></line>
    </symbol>
    <symbol id="icon-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
      <polyline points="17 21 17 13 7 13 7 21"></polyline>
      <polyline points="7 3 7 8 15 8"></polyline>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      <line x1="10" y1="11" x2="10" y2="17"></line>
      <line x1="14" y1="11" x2="14" y2="17"></line>
    </symbol>
    <symbol id="icon-export" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </symbol>
    <symbol id="icon-import" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </symbol>
    <symbol id="icon-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </symbol>
  </svg>

  <div class="page">
    <header class="page-header">
      <h1 data-i18n="feeds.title"></h1>
      <div class="actions">
        <!-- The switcher `lib/nav.js` fills with the three screen icons, current screen marked. -->
        <nav class="nav" data-nav-active="feeds" data-i18n-aria="nav.group"></nav>
        <button id="btn-theme" class="icon-btn theme-toggle" type="button" data-i18n-title="common.theme.toggle" data-i18n-aria="common.theme.toggle">
          <svg class="icon icon-moon" aria-hidden="true"><use href="#icon-moon"></use></svg>
          <svg class="icon icon-sun" aria-hidden="true"><use href="#icon-sun"></use></svg>
        </button>
      </div>
    </header>

    <div class="table-bar">
      <div class="bar-tools">
        <button
          id="btn-add"
          class="icon-btn"
          type="button"
          data-i18n-title="feeds.add"
          data-i18n-aria="feeds.add"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-add"></use></svg>
        </button>
        <button
          id="btn-export"
          class="icon-btn"
          type="button"
          data-i18n-title="feeds.export"
          data-i18n-aria="feeds.export"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-export"></use></svg>
        </button>
        <button
          id="btn-import"
          class="icon-btn"
          type="button"
          data-i18n-title="feeds.import"
          data-i18n-aria="feeds.import"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-import"></use></svg>
        </button>
        <!-- The file picker behind the import icon: the icon is what the user presses, the field is
             what reads the answer, so it takes no room and no name of its own. -->
        <input id="file-import" class="file-import" type="file" accept="application/json,.json" hidden />
      </div>
      <details class="info">
        <summary
          class="icon-btn"
          data-i18n-title="feeds.info.tooltip"
          data-i18n-aria="feeds.info.aria"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-help"></use></svg>
        </summary>
        <p class="hint" data-i18n="feeds.hint"></p>
      </details>
    </div>

    <table class="feed-table" data-i18n-aria="feeds.title">
      <!-- The columns are named by `<th>`, which a sighted person reads as the head of the table and
           a screen reader does not announce on its own; a caption names the table itself. -->
      <caption class="sr-only" data-i18n="feeds.caption"></caption>
      <thead>
        <tr>
          <th data-i18n="feeds.field.name"></th>
          <th data-i18n="feeds.field.rss"></th>
          <th data-i18n="feeds.field.delay"></th>
          <th data-i18n="feeds.field.clean"></th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="feed-rows"></tbody>
    </table>
    <p class="empty muted" id="feeds-empty" data-i18n="feeds.empty"></p>

    <!-- What a transfer of the whole table just did: how many feeds left, how many arrived. It
         speaks of the table as a whole, so it stands under it, not inside a row. -->
    <p class="transfer-status muted" id="transfer-status" hidden></p>

    <!--
      What the screen says out loud about its buttons working: a feed is saved, a row has fields left
      unfilled, how many headlines came on the "Load now" button, how many feeds were written out to a file
      and how many were read back in. The same words stand under the row or under the table, where the eye
      sees them; this line is drawn nowhere (see `.sr-only` in `theme.css`), but a screen reader reads it
      aloud.
    -->
    <p class="sr-only" id="feeds-announce" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
</body>
</html>
